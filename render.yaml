services:
  - type: web
    name: hotelai-backend
    runtime: python
    plan: free # no persistent disk — the catalogue is seeded from files committed to
    # the repo (data/processed/chromadb/ + hotels_data.jsonl), rebuilt fresh on every
    # deploy/clone. PDFs uploaded through the running app only last until the next
    # redeploy or free-tier sleep/wake cycle (see README note in the deploy wizard).
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: google
      - key: EMBEDDING_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-flash-latest
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
