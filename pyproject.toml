[project]
name = "fde-hotel-rag"
version = "0.1.0"
description = "PDF-to-MCP hotel search assignment"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1,<2",
  "fastmcp>=2,<3",
  "google-genai>=1,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
