[project]
name = "hotelai"
version = "0.1.0"
description = "HotelAI: PDF ingestion, hybrid RAG search and an MCP server for hotel data"
requires-python = ">=3.11"
# Le dipendenze runtime/dev sono in requirements.txt (unica fonte di verità: `pip install -r requirements.txt`);
# questo file non ne mantiene una copia per evitare che le due liste divergano.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except) and B008 (Depends()/File() as call defaults) are both
# deliberate here: broad except-and-degrade is this codebase's documented failure
# policy (see AGENTS.md), and Depends()/File() in argument defaults is required
# FastAPI usage, not a mutable-default bug.
ignore = ["BLE001", "B008"]
